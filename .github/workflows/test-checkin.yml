name: 雨云测试账号签到

# 安全加固说明（相对上游改动）：
#   1. 第三方 Action 固定到 commit SHA
#   2. 移除账号/密码输入框：workflow_dispatch 的输入会以明文保存在运行记录元数据中，
#      改用 Secrets（RAINYUN_TEST_USERNAME / RAINYUN_TEST_PASSWORD）
#   3. 收窄 GITHUB_TOKEN 权限，日志仅失败时上传
# 注意：本工作流只应在你确认不需要时删除；它使用独立的测试账号凭据。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rainyun-test-checkin
  cancel-in-progress: false

jobs:
  checkin-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装中文字体并设置上海时区
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei tzdata
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone > /dev/null

      - name: 设置 Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行测试签到
        env:
          RAINYUN_USERNAME: ${{ secrets.RAINYUN_TEST_USERNAME }}
          RAINYUN_PASSWORD: ${{ secrets.RAINYUN_TEST_PASSWORD }}
          RUN_MODE: 'once'
          DEBUG: 'false'
          MAX_DELAY: '1'
          TIMEOUT: '60000'
          CHECKIN_MAX_RETRIES: '3'
          MAX_WORKERS: '1'
          ENABLE_FREE_PROXY: 'true'
          PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
          SCREENSHOT_MODE: 'failed_only'
        run: |
          python rainyun.py

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-checkin-logs-${{ github.run_number }}
          path: logs/
          retention-days: 3
