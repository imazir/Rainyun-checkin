name: 雨云每日签到

# 安全加固说明（相对上游改动）：
#   1. 所有第三方 Action 固定到 commit SHA，防止 tag 被移动导致供应链投毒
#   2. 显式声明 permissions: contents: read，收窄 GITHUB_TOKEN 权限
#   3. 移除 push 触发，避免改文件即跑（也避免 fork 后误触发）
#   4. 移除 workflow_dispatch 的账号/密码输入框：工作流输入会以明文记录在运行元数据里
#   5. 增加 concurrency，避免定时任务与手动触发叠加并发
#   6. checkout 关闭 persist-credentials，避免凭据残留在 .git/config
#   7. 日志仅在失败时上传，减少敏感信息留存面

on:
  # 每天北京时间 6:15（UTC 22:45）执行
  schedule:
    - cron: '15 22 * * *'
  # 手动触发（仅用于排查，不再接受账号密码输入）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rainyun-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装中文字体并设置上海时区
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei tzdata
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone > /dev/null

      - name: 设置 Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装 Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 缓存 Cookie（避免每日重复登录）
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.2.3
        with:
          path: temp/cookies
          key: cookies-${{ github.run_id }}
          restore-keys: |
            cookies-

      - name: 执行签到
        env:
          RAINYUN_USERNAME: ${{ secrets.RAINYUN_USERNAME }}
          RAINYUN_PASSWORD: ${{ secrets.RAINYUN_PASSWORD }}
          # ---- 通知渠道（可选，至少配一个才会收到推送）----
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          WXPUSHER_TOPIC_IDS: ${{ secrets.WXPUSHER_TOPIC_IDS }}
          DINGTALK_ACCESS_TOKEN: ${{ secrets.DINGTALK_ACCESS_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          # ---- 运行配置 ----
          RUN_MODE: 'once'
          DEBUG: 'false'
          MAX_DELAY: '1'
          TIMEOUT: '60000'
          CHECKIN_MAX_RETRIES: '3'
          MAX_WORKERS: '1'
          # ---- 安全开关 ----
          # 免费公开代理不可信：登录密码会经过来源不明的第三方节点，且频繁换 IP 易触发风控。
          #   'true'  = 直连被拦截时自动抓取国内免费代理（开箱即用，但凭据经第三方转发）
          #   'false' = 绝不使用免费代理；请同时配置 PROXY_API_URL 指向你自己可信的代理
          ENABLE_FREE_PROXY: 'true'
          # 配置了你自己的可信代理接口后填这里（如 https://your-proxy-api/get?token=xxx）
          PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
          # 截图策略：all / failed_only / none（none 最省流量且最少留存截图）
          SCREENSHOT_MODE: 'failed_only'
        run: |
          python rainyun.py

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checkin-logs-${{ github.run_number }}
          path: logs/
          retention-days: 3
